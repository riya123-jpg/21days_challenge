<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background-color: #1e2a38;
        color: #ffffff;
        line-height: 1.6;
      }

      header {
        /* background-color: #2c3e50; */
        background: linear-gradient(135deg, #2c3e50, #1e2a38);
        padding: 20px;
        text-align: center;
      }

      header h1 {
        margin: 0;
      }

      nav {
        margin-top: 10px;
      }

      nav a {
        margin: 0 15px;
        /* margin: 5px 30px; */
        color: #aaaaaa;
        text-decoration: none;
        font-weight: 500;
      }

      nav a:hover {
        color: #1abc9c;
      }

      main {
        max-width: 850px;
        margin: 108px auto;
        padding: 0 20px;
      }

      section,
      article {
        background-color: #2c3e50;
        cursor: pointer;
        padding: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        margin-bottom: 20px;
        border-radius: 8px;
      }
      section:hover,
      article:hover {
        transform: translateY(-5px);
        transition: 0.3s;
      }
      h2 {
        margin-top: 0;
        color: #1abc9c;
      }

      footer {
        text-align: center;
        padding: 15px;
        color: #aaaaaa;
        background-color: #2c3e50;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <!-- semantic Tag -->
    <header>
      <h1>My Portfolio</h1>
      <nav>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>
    <main>
      <section id="about">
        <h2>About Me</h2>
        <p>
          I am frontend developer passionate about creating responsive and
          user-friendly websites.
        </p>
      </section>
      <article id="project1">
        <h2>Project One</h2>
        <p>This project showcase my skills in web development.</p>
      </article>
    </main>
    <footer>
      <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>
  </body>
</html>
